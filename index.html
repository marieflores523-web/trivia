<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia IA - Kahoot Style</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body { background-color: #46178f; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 900px; background: #ffffff; color: #333333; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); text-align: center; }
    h1 { font-size: 2.5rem; color: #46178f; margin-bottom: 10px; font-weight: 900; }
    p.subtitle { color: #666; margin-bottom: 25px; font-weight: 700; }
    .btn { background-color: #26890c; color: white; border: none; padding: 18px 36px; font-size: 1.3rem; font-weight: bold; border-radius: 12px; cursor: pointer; box-shadow: 0 5px 0 #185906; margin: 10px; }
    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background-color: #1368ce; box-shadow: 0 5px 0 #0d4a99; }
    input[type="text"] { width: 100%; padding: 14px; font-size: 1.1rem; border: 2px solid #ddd; border-radius: 10px; margin-bottom: 15px; font-family: 'Montserrat', sans-serif; }
    .setup-label { display:block; text-align:left; font-weight:700; color:#46178f; margin-bottom:8px; }
    .game-stats { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold; }
    .stat-box { background: #f0f0f0; padding: 10px 20px; border-radius: 20px; color: #333; }
    .timer-circle { width: 65px; height: 65px; border-radius: 50%; background: #864cbf; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 900; flex-shrink:0; }
    .question-box { background: #f8f9fa; border: 2px solid #e0e0e0; border-radius: 15px; padding: 25px; margin-bottom: 25px; min-height: 100px; display: flex; align-items: center; justify-content: center; }
    .question-text { font-size: 1.4rem; font-weight: 700; color: #222; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .option-btn { color: white; border: none; padding: 20px; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; min-height: 80px; }
    .option-btn:disabled { cursor: not-allowed; }
    .opt-0 { background-color: #e21b3c; }
    .opt-1 { background-color: #1368ce; }
    .opt-2 { background-color: #d89e00; }
    .opt-3 { background-color: #26890c; }
    .feedback { margin-top: 20px; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; display: none; }
    .feedback.correct { background-color: #d4edda; color: #155724; }
    .feedback.incorrect { background-color: #f8d7da; color: #721c24; }
    .hidden { display: none !important; }
    .spinner { border: 6px solid #eee; border-top: 6px solid #46178f; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg);} 100% { transform: rotate(360deg);} }
    .error-box { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 10px; margin-top: 15px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <h1>☁️ TRIVIA IA!</h1>
    <p class="subtitle">Preguntas generadas por IA sobre el tema que elijas</p>

    <div id="setup-screen">
      <label class="setup-label" for="apikey-input">Tu API Key de Groq</label>
      <input type="password" id="apikey-input" placeholder="gsk_...">
      <label class="setup-label" for="topic-input">¿Sobre qué tema quieres jugar?</label>
      <input type="text" id="topic-input" value="Modelos de Servicio en la Nube: IaaS, PaaS y SaaS" placeholder="Ej: Revolución Francesa, Balanza de Pagos, Ética en IA...">
      <label style="display:flex; align-items:center; gap:8px; text-align:left; font-size:0.9rem; color:#666; margin-bottom:15px;">
        <input type="checkbox" id="remember-key" style="width:auto;"> Recordar mi API key en este navegador
      </label>
      <button class="btn" id="generate-btn" onclick="startRandomGame()">🎲 GENERAR TRIVIA CON IA</button>
      <div id="setup-error"></div>
    </div>

    <div id="loading-screen" class="hidden">
      <div class="spinner"></div>
      <p style="font-weight:700; color:#46178f;">La IA está creando tus preguntas...</p>
    </div>

    <div id="game-screen" class="hidden">
      <div class="game-stats">
        <div class="stat-box">Pregunta: <span id="q-num">1</span>/10</div>
        <div class="timer-circle" id="timer">45</div>
        <div class="stat-box">Puntos: <span id="score">0</span></div>
      </div>
      <div class="question-box">
        <div class="question-text" id="question">Cargando...</div>
      </div>
      <div class="options-grid">
        <button class="option-btn opt-0" onclick="selectAnswer(0)"><span id="opt0-text"></span></button>
        <button class="option-btn opt-1" onclick="selectAnswer(1)"><span id="opt1-text"></span></button>
        <button class="option-btn opt-2" onclick="selectAnswer(2)"><span id="opt2-text"></span></button>
        <button class="option-btn opt-3" onclick="selectAnswer(3)"><span id="opt3-text"></span></button>
      </div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" class="btn hidden" style="margin-top:20px;" onclick="nextQuestion()">Siguiente ➡️</button>
    </div>

    <div id="final-screen" class="hidden">
      <h2>🎉 ¡Juego Completado!</h2>
      <p style="margin:20px 0; font-size:1.5rem;">Puntuación final: <strong id="final-score" style="color:#26890c;">0</strong> pts</p>
      <div style="background:#f0f0f0; border-radius:15px; padding:20px; margin-bottom:20px;">
        <p style="font-weight:700; color:#666; margin-bottom:5px;">Nota (escala 3.0 - 5.0)</p>
        <p style="font-size:2.2rem; font-weight:900; color:#46178f;" id="final-grade">3.0</p>
        <p style="font-size:0.95rem; color:#666;" id="final-correct">0/10 correctas</p>
      </div>
      <button class="btn" onclick="resetToSetup()">🔄 Jugar Otra Vez (Tema Nuevo o Igual)</button>
    </div>
  </div>

  <script>
    let questions = [], currentQ = 0, score = 0, correctCount = 0, timer, timeLeft = 45;

    try {
      const savedKey = localStorage.getItem('trivia_ia_key');
      if (savedKey) {
        document.getElementById('apikey-input').value = savedKey;
        document.getElementById('remember-key').checked = true;
      }
    } catch (e) { /* localStorage no disponible, no pasa nada */ }

    async function generateQuestions(topic, apiKey) {
      const prompt = `Genera exactamente 10 preguntas de trivia tipo Kahoot en español sobre el siguiente tema: "${topic}".

Cada pregunta debe tener:
- "question": el texto de la pregunta
- "options": un array de exactamente 4 opciones de respuesta (strings cortos)
- "correct": el índice (0-3) de la opción correcta
- "explanation": una explicación breve (máximo 20 palabras) de por qué esa es la respuesta correcta

Las preguntas deben variar en dificultad, ser claras, y cubrir distintos aspectos del tema.

Evita en lo posible preguntas que dependan de un ejemplo para poder responderse; prioriza preguntas directas sobre el concepto. Si de verdad necesitas un ejemplo, usa ÚNICAMENTE apps o servicios súper conocidos y cotidianos para cualquier persona, como Gmail, Netflix, Spotify, WhatsApp o Instagram. NUNCA uses ejemplos técnicos como AWS, Azure, Google Cloud u otros nombres de infraestructura que no sean de uso diario para el público general.

Responde ÚNICAMENTE con un array JSON válido, sin texto adicional, sin markdown, sin backticks. Formato exacto:
[{"question":"...","options":["...","...","...","..."],"correct":0,"explanation":"..."}, ...]`;

      const response = await fetch(
        "https://api.groq.com/openai/v1/chat/completions",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [{ role: "user", content: prompt }]
          })
        }
      );

      if (!response.ok) {
        const errBody = await response.json().catch(() => ({}));
        const msg = errBody?.error?.message || ("Error de conexión con la IA (" + response.status + ")");
        throw new Error(msg);
      }

      const data = await response.json();
      const text = data?.choices?.[0]?.message?.content;
      if (!text) throw new Error("La IA no devolvió texto");

      let clean = text.trim().replace(/```json/g, "").replace(/```/g, "").trim();
      const parsed = JSON.parse(clean);

      if (!Array.isArray(parsed) || parsed.length < 5) throw new Error("Formato de preguntas inválido");
      return parsed;
    }

    function shuffle(array) {
      return JSON.parse(JSON.stringify(array)).sort(() => Math.random() - 0.5);
    }

    async function startRandomGame() {
      const topic = document.getElementById('topic-input').value.trim();
      const apiKey = document.getElementById('apikey-input').value.trim();
      const remember = document.getElementById('remember-key').checked;
      const errorDiv = document.getElementById('setup-error');
      errorDiv.innerHTML = '';

      if (!apiKey) {
        errorDiv.innerHTML = '<div class="error-box">Por favor ingresa tu API key de Groq.</div>';
        return;
      }
      if (!topic) {
        errorDiv.innerHTML = '<div class="error-box">Por favor escribe un tema para generar las preguntas.</div>';
        return;
      }

      try {
        if (remember) localStorage.setItem('trivia_ia_key', apiKey);
        else localStorage.removeItem('trivia_ia_key');
      } catch (e) { /* localStorage no disponible, no pasa nada */ }

      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('loading-screen').classList.remove('hidden');

      try {
        const raw = await generateQuestions(topic, apiKey);

        questions = raw.slice(0, 10).map(q => {
          let opts = shuffle(q.options.map((opt, i) => ({ text: opt, isCorrect: i === q.correct })));
          return {
            question: q.question,
            options: opts.map(o => o.text),
            correct: opts.findIndex(o => o.isCorrect),
            explanation: q.explanation
          };
        });

        currentQ = 0; score = 0; correctCount = 0;
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        loadQuestion();
      } catch (err) {
        document.getElementById('loading-screen').classList.add('hidden');
        document.getElementById('setup-screen').classList.remove('hidden');
        errorDiv.innerHTML = '<div class="error-box">⚠️ No se pudieron generar las preguntas. Intenta de nuevo. (' + err.message + ')</div>';
      }
    }

    function loadQuestion() {
      clearInterval(timer); timeLeft = 45;
      document.getElementById('timer').innerText = timeLeft;
      const q = questions[currentQ];
      document.getElementById('q-num').innerText = currentQ + 1;
      document.getElementById('q-num').parentElement.innerHTML = 'Pregunta: <span id="q-num">' + (currentQ+1) + '</span>/' + questions.length;
      document.getElementById('question').innerText = q.question;
      document.getElementById('score').innerText = score;
      q.options.forEach((opt, i) => document.getElementById(`opt${i}-text`).innerText = opt);
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = false);
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').classList.add('hidden');
      timer = setInterval(() => {
        timeLeft--; document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) selectAnswer(-1);
      }, 1000);
    }

    function selectAnswer(i) {
      clearInterval(timer);
      const q = questions[currentQ];
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      const fb = document.getElementById('feedback'); fb.style.display = 'block';
      if (i === q.correct) {
        score += 500 + (timeLeft * 15);
        correctCount++;
        document.getElementById('score').innerText = score;
        fb.className = 'feedback correct'; fb.innerHTML = `🎯 ¡CORRECTO!<br><small>${q.explanation}</small>`;
      } else {
        fb.className = 'feedback incorrect';
        fb.innerHTML = `❌ Incorrecto. La respuesta era: <strong>${q.options[q.correct]}</strong><br><small>${q.explanation}</small>`;
      }
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ < questions.length) loadQuestion();
      else {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('final-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = score;

        const total = questions.length;
        const grade = 3.0 + (correctCount / total) * 2.0;
        document.getElementById('final-grade').innerText = grade.toFixed(1);
        document.getElementById('final-correct').innerText = correctCount + '/' + total + ' correctas';
      }
    }

    function resetToSetup() {
      document.getElementById('final-screen').classList.add('hidden');
      document.getElementById('setup-screen').classList.remove('hidden');
      document.getElementById('setup-error').innerHTML = '';
    }
  </script>
</body>
</html>
